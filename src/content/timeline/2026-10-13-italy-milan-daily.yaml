title: "義大利／米蘭日常分享"
id: "2026-10-13-italy-milan-daily"
category: "社交平台／日常"
description: >-
  陳偉霆於微博及小紅書同步分享義大利／米蘭旅途日常，以「意大利／在意」作文字遊戲。微博寫道「“意”不小心，我又双叒叕来了。」，小紅書則寫道「我不在意了，我在意大利！」，並分享米蘭街景、用餐及旅途中照片。
