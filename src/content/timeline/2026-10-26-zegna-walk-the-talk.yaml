description: "ZEGNA 公開由全球品牌大使陳偉霆出演的《WALK THE TALK》形象企劃。企劃從他的音樂起點延伸至今日不同角色，圍繞「言與行」以及以行動回應熱愛、兌現所言的主題展開。陳偉霆亦於本人微博以第一人稱分享「從音樂到表演，我用行動回應最初的熱愛」，將這份堅持形容為自己與 ZEGNA 的共鳴。"
