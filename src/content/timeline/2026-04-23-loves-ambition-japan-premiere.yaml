date: "2026-04-23"
title: "《許我耀眼》於日本首次播出"
id: "2026-04-23-loves-ambition-japan-premiere"
category: "電視劇／日本播出"
description: >-
  2026年4月23日，由陳偉霆與趙露思主演的電視劇《許我耀眼》，以日文名稱《私の完璧な結婚》於日本「ホームドラマチャンネル」首次播出。
  本次為日本首次電視播出，採用日語字幕版，首播安排為每週星期二至星期四晚上19:00（JST，日本時間）。
source: "松竹ブロードキャスティング｜2026年2月25日官方新聞稿"
