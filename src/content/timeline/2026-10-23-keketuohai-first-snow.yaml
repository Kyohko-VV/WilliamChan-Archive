date: "2026-10-23"
title: "陳偉霆現身新疆可可托海，分享初雪照片"
id: "2026-10-23-keketuohai-first-snow"
category: "社交平台／日常"
description: >-
  2026年10月23日，陳偉霆透過個人小紅書分享在新疆阿勒泰地區可可托海拍攝的雪景照片，配文「在可可托海看今年第一場雪」。
  同日，新疆廣播電視台於微博提及陳偉霆來到可可托海，因當地大雪紛飛、能見度不佳，當時未能滑雪。
  此外，同行的化妝師及髮型師亦透過 Instagram Stories 分享了當地的現場畫面。
source: "陳偉霆個人小紅書"
