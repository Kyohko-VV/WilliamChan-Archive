date: "2026-10-26"
title: "《許我耀眼》於日本ホームドラマチャンネル開始重播"
id: "2026-10-26-loves-ambition-japan-encore"
category: "電視劇／日本重播"
description: >-
  2026年10月26日起，由陳偉霆與趙露思主演的中國電視劇《許我耀眼》（日本播出名稱：《私の完璧な結婚》），於日本衛星電視頻道「ホームドラマチャンネル」開始重播。
  本次為「アンコール放送」（重播），自10月26日星期一開始，每週星期一至星期四上午07:00（JST，日本時間）播出。
source: "ホームドラマチャンネル｜官方節目頁"
