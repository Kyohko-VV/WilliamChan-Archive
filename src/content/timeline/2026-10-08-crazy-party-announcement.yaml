category: "活動"
description: |-
  2026 年 10 月 8 日，陳偉霆正式公布將於 11 月 21 日在澳門新濠影滙綜藝館舉行《Crazy Party 瘋狂派對》。

  本次活動以生日為契機，以 Live 音樂演出為核心，結合樂隊、舞蹈與粉絲互動，並非傳統形式的生日會或粉絲見面會。
